<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>fuin — Android DEX Packer</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<div class="container">

  <header>
    <img src="/static/logo.png" alt="fuin" style="width:100%;max-width:800px;margin-bottom:12px;display:block;" />
    <p>Upload an APK. Select what to encrypt. Get a protected APK back.</p>
  </header>

  <!-- API Key -->
  <div class="api-key-row">
    <input id="api-key" type="password" placeholder="X-API-Key" autocomplete="off" />
    <button id="save-key-btn">Save</button>
  </div>

  <!-- Drop zone -->
  <div class="dropzone" id="dropzone">
    <input type="file" id="file-input" accept=".apk" />
    <div class="dropzone-icon">📦</div>
    <p><strong>Drop your APK here</strong><br/>or click to browse</p>
  </div>

  <!-- Analyze section (file selection) -->
  <div id="analyze-section">
    <div class="analyze-card">
      <h3>Encryption Targets</h3>
      <div id="analyze-content">
        <div class="analyze-loading">Analyzing APK...</div>
      </div>
    </div>
  </div>

  <!-- Options -->
  <div class="options-grid">
    <div class="option-row">
      <label>Application class (optional)</label>
      <input id="app-class" type="text" placeholder="com.example.MyApp (auto-detected)" />
    </div>
    <div class="option-row">
      <label>Webhook URL (optional)</label>
      <input id="webhook-url" type="url" placeholder="https://hooks.example.com/notify" />
    </div>
  </div>

  <button class="pack-btn" id="pack-btn" disabled>Pack APK</button>

  <!-- Progress -->
  <div id="progress-section">
    <div class="progress-label">
      <span class="step-name" id="step-label">Preparing…</span>
      <span class="pct" id="pct-label">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="steps" id="steps-list"></div>
  </div>

  <!-- Result -->
  <div id="result-section">
    <div class="result-card" id="result-card"></div>
  </div>

  <hr class="divider" />

  <!-- Apps list -->
  <div id="apps-section">
    <h2>
      Packed Apps
      <button class="refresh-btn" id="refresh-apps-btn">↻ refresh</button>
    </h2>
    <div class="apps-list" id="apps-list"><div class="empty-state">Loading…</div></div>
  </div>

</div>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
